<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#5538ca"><link rel="icon" href="icon.png"><title>גאון החשבון – הרפתקאות קטנות</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,system-ui,sans-serif;background:linear-gradient(145deg,#292078,#6552d4 55%,#f174bd);color:#fff}button{font:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #ffdd68}.wrap{max-width:900px;margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{display:flex;align-items:center;gap:12px}.logo{height:64px;width:64px;border-radius:20px;object-fit:cover;box-shadow:0 5px 20px #12064b66}.small{font-size:13px;opacity:.85}.pill{border-radius:50px;padding:10px 14px;background:#ffffff2c;font-weight:700}.hero{text-align:center;padding:22px 12px}.hero img{width:min(210px,50vw);aspect-ratio:1;object-fit:cover;border-radius:36px;box-shadow:0 15px 40px #21125a88}.hero h1{font-size:clamp(30px,6vw,48px);margin:15px 0 5px}.hero p{opacity:.9}.panel{background:#fff;color:#332767;border-radius:28px;padding:22px;box-shadow:0 14px 35px #180c5b50;margin:18px 0}.panel h2{margin-top:0}.levels,.worlds,.houses,.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px}.tile{border:0;border-radius:22px;padding:20px 14px;text-align:center;background:linear-gradient(135deg,#f4f0ff,#e7e0ff);color:#322365;box-shadow:0 5px 0 #cfc5f6;min-height:125px}.tile .emoji{font-size:36px;display:block;margin-bottom:9px}.tile strong{display:block;font-size:18px}.tile small{display:block;margin-top:7px}.tile:disabled{opacity:.5;filter:grayscale(1);cursor:not-allowed}.btn{background:#ffcf52;border:0;color:#4d2d65;font-weight:900;border-radius:16px;padding:12px 18px;box-shadow:0 5px 0 #d69c2b}.secondary{background:#ece8ff;box-shadow:0 4px 0 #c5baf6}.nav{display:flex;gap:9px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:8px 0}.progress{height:12px;background:#e8e1fa;border-radius:30px;overflow:hidden}.progress div{height:100%;background:linear-gradient(90deg,#6b5df6,#f6a5df);transition:width .3s}.gamebox{background:linear-gradient(150deg,#f9f4ff,#fff);border:4px solid #e9dcff;border-radius:25px;min-height:275px;padding:18px;text-align:center}.prompt{font-size:clamp(21px,4vw,30px);font-weight:900;margin:7px 0 22px}.items{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;margin:15px 0;min-height:62px}.item{font-size:32px;border:0;background:#eee8ff;border-radius:15px;min-width:49px;min-height:51px;padding:5px}.item.selected{background:#ffd36d;transform:scale(1.07)}.targets{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:20px}.target{border:3px dashed #9b8bdb;background:#f2edff;border-radius:20px;min-width:115px;min-height:100px;padding:14px;display:grid;place-content:center;gap:6px}.target b{font-size:26px}.answer{font-size:24px;border:0;background:#ede7ff;color:#302369;border-radius:18px;padding:16px;min-width:70px;box-shadow:0 4px 0 #cfc4f1}.answer:active,.tile:active{transform:translateY(3px)}.feedback{min-height:35px;font-weight:800;margin-top:16px}.success{color:#14875a}.error{color:#d03e69}.hint{color:#71639b;font-size:14px}.meter{font-size:18px;font-weight:800}.hidden{display:none!important}.slice{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:50%;background:conic-gradient(#f9b448 0 50%,#fff0c9 50% 100%);border:4px solid #e58d38;font-weight:bold}.foot{text-align:center;font-size:12px;opacity:.8;padding:18px}.stars{color:#e6a800}.chip{display:inline-block;background:#efe8ff;padding:7px 12px;border-radius:20px;margin:4px}.dropHover{background:#d6f9e8!important;border-color:#36bd86!important}@media(max-width:500px){.wrap{padding:11px}.panel{padding:15px;border-radius:22px}.levels,.worlds,.houses{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{padding:13px 8px;min-height:115px}.logo{height:49px;width:49px}.target{min-width:100px}}
</style></head><body><main class="wrap"><header class="top"><div class="brand"><img src="icon.png" class="logo" alt="הפרצוף המקורי של גאון החשבון"><div><strong>גאון החשבון</strong><div class="small">משחקי חשבון שמרגישים כמו קסם</div></div></div><div class="pill" id="wallet">🪙 0</div></header><section id="app"></section><footer class="foot">כל ההתקדמות נשמרת בדפדפן במכשיר הזה · אפשר לשחק גם ללא אינטרנט לאחר הורדת הקבצים</footer></main><script>
const groups=[{name:'מתנסים',age:'4–6',emoji:'🧸',worlds:[['מספרים','🔢'],['צורות וכמויות','🧩']]},{name:'מתחילים',age:'6–8',emoji:'🚀',worlds:[['חיבור','🍎'],['חיסור','🎈']]},{name:'מתקדמים',age:'8–10',emoji:'🏰',worlds:[['כפל','🍭'],['חילוק','🎁']]},{name:'מנוסים',age:'10–19',emoji:'🏆',worlds:[['שברים','🍕'],['חזקות','⚡']]}];
const key='gaon_satisfying_v1';let save;try{save=JSON.parse(localStorage.getItem(key))||{wins:{},coins:0}}catch(e){save={wins:{},coins:0}};let group=0,world=0,stage=0,task=null,chosen=[],completed=false;const app=document.getElementById('app');const $=s=>document.querySelector(s);const rand=(a,b)=>Math.floor(Math.random()*(b-a+1))+a;const shuffle=a=>a.sort(()=>Math.random()-.5);const id=(g,w,s)=>`${g}-${w}-${s}`;const won=(g,w,s)=>!!save.wins[id(g,w,s)];function persist(){try{localStorage.setItem(key,JSON.stringify(save))}catch(e){}$('#wallet').textContent='🪙 '+save.coins}function topnav(title,back){return `<div class="nav"><button class="btn secondary" onclick="${back}()">↩ חזרה</button><strong>${title}</strong><span class="pill">⭐ ${Object.keys(save.wins).length}/240</span></div>`}function home(){app.innerHTML=`<section class="hero"><img src="icon.png" alt="הפרצוף שצירפת – הלוגו של גאון החשבון"><h1>גאון החשבון</h1><p>גוררים, מסדרים, מחלקים ופותרים! כל שלב הוא משחקון קטן.</p><button class="btn" onclick="levels()">▶ בואו נשחק!</button></section><div class="panel"><h2>איך משחקים?</h2><div class="chip">👆 נוגעים</div><div class="chip">🧲 גוררים</div><div class="chip">🧠 חושבים</div><div class="chip">⭐ זוכים</div><p class="hint">4 רמות · 8 עולמות · 6 בתים בכל עולם · 5 שלבים בכל בית</p></div>`}function levels(){app.innerHTML=topnav('בחרו רמה','home')+`<div class="panel"><h2>איזה הרפתקנים אתם?</h2><div class="levels">${groups.map((g,i)=>`<button class="tile" onclick="openGroup(${i})"><span class="emoji">${g.emoji}</span><strong>${g.name}</strong><small>גיל ${g.age}</small></button>`).join('')}</div></div>`}function openGroup(g){group=g;app.innerHTML=topnav(groups[g].name,'levels')+`<div class="panel"><h2>בחרו עולם</h2><div class="worlds">${groups[g].worlds.map((w,i)=>`<button class="tile" onclick="openWorld(${i})"><span class="emoji">${w[1]}</span><strong>עולם ${w[0]}</strong><small>30 שלבים · 6 בתים</small></button>`).join('')}</div></div>`}function openWorld(w){world=w;let name=groups[group].worlds[world][0];app.innerHTML=topnav('עולם '+name,'backGroup')+`<div class="panel"><h2>🏡 הבתים של עולם ${name}</h2><p class="hint">כל בית כולל 5 משחקונים. השלימו בית כדי לפתוח את הבא.</p><div class="houses">${Array.from({length:6},(_,h)=>{let unlocked=h===0||won(group,world,h*5-1);let done=Array.from({length:5},(_,j)=>won(group,world,h*5+j)).filter(Boolean).length;return `<button class="tile" ${unlocked?'':'disabled'} onclick="openHouse(${h})"><span class="emoji">${unlocked?'🏠':'🔒'}</span><strong>בית ${h+1}</strong><small>${done}/5 שלבים הושלמו</small></button>`}).join('')}</div></div>`}function backGroup(){openGroup(group)}function openHouse(h){let start=h*5;app.innerHTML=topnav('בית '+(h+1),'backWorld')+`<div class="panel"><h2>בחרו שלב</h2><div class="stages">${Array.from({length:5},(_,i)=>{let s=start+i,unlocked=i===0? (h===0||won(group,world,s-1)):won(group,world,s-1);return `<button class="tile" ${unlocked?'':'disabled'} onclick="play(${s})"><span class="emoji">${won(group,world,s)?'🌟':unlocked?'🎮':'🔒'}</span><strong>שלב ${s+1}</strong><small>${won(group,world,s)?'הושלם':'משחקון חדש'}</small></button>`}).join('')}</div></div>`}function backWorld(){openWorld(world)}function makeTask(){let n=stage+1,level=Math.floor(stage/5),a,b;let type=groups[group].worlds[world][0];if(type==='מספרים'){a=rand(1,Math.min(5+level*2,15));return {type:'count',a,answer:a,icon:['🍓','⭐','🐥'][stage%3]}}if(type==='צורות וכמויות'){a=rand(2,Math.min(6+level*2,16));return {type:'sort',a,answer:a,icon:['🔵','🟡','🟣'][stage%3]}}if(type==='חיבור'){a=rand(1,4+level*2);b=rand(1,4+level*2);return {type:'add',a,b,answer:a+b}}if(type==='חיסור'){a=rand(4,9+level*3);b=rand(1,a-1);return {type:'subtract',a,b,answer:a-b}}if(type==='כפל'){a=rand(2,Math.min(4+level,10));b=rand(2,Math.min(5+level,10));return {type:'multiply',a,b,answer:a*b}}if(type==='חילוק'){b=rand(2,Math.min(4+level,10));a=rand(2,Math.min(5+level,10));return {type:'divide',a:a*b,b,answer:a}}if(type==='שברים'){b=[2,3,4,5,6,8][level];a=rand(1,b-1);return {type:'fraction',a,b,answer:a}}b=rand(2,Math.min(3+Math.floor(level/2),5));a=rand(2,Math.min(3+level,8));return {type:'power',a,b,answer:a**b}}
function choices(correct){let set=new Set([correct]);let delta=Math.max(2,Math.ceil(correct*.3));while(set.size<4){let x=correct+rand(-delta,delta);if(x>=0)set.add(x)}return shuffle([...set])}function play(s){stage=s;task=makeTask();chosen=[];completed=false;renderGame()}function renderGame(){let t=task;let names=['לספור','למיין','לחבר','להחסיר','לכפול','לחלק','שברים','חזקות'];let label=groups[group].worlds[world][0];let html=topnav(`עולם ${label} · שלב ${stage+1}`,'backHouse')+`<div class="panel"><div class="nav"><span class="meter">${groups[group].emoji} ${label}</span><span class="stars">⭐ ${won(group,world,stage)?'הושלם':'שלב חדש'}</span></div><div class="progress"><div style="width:${(stage%5+1)*20}%"></div></div><div class="gamebox" id="gamebox">`;
if(t.type==='count'||t.type==='sort'){html+=`<div class="prompt">${t.type==='count'?'כמה פריטים יש כאן?':'העבירו את כל הפריטים לקופסה!'}</div><div class="items" id="source">${Array.from({length:t.a},(_,i)=>`<button class="item" draggable="true" data-i="${i}" onclick="pick(${i})" ondragstart="dragStart(event,${i})">${t.icon}</button>`).join('')}</div>`;if(t.type==='sort')html+=`<div class="targets"><div class="target" id="basket" ondragover="event.preventDefault()" ondrop="dropItem(event)"><b>🧺</b><span id="basketCount">0 / ${t.a}</span></div></div><p class="hint">לחצו על הפריטים או גררו אותם לסל</p>`;else html+=`<div class="targets">${choices(t.answer).map(x=>`<button class="answer" onclick="check(${x})">${x}</button>`).join('')}</div>`}
else if(t.type==='add'){html+=`<div class="prompt">אספו את כל הפירות 🍎</div><div class="items">${'🍎'.repeat(t.a)} <strong style="font-size:30px">+</strong> ${'🍏'.repeat(t.b)}</div><p>כמה פירות יש ביחד?</p>${answerButtons(t.answer)}`}
else if(t.type==='subtract'){html+=`<div class="prompt">העלימו ${t.b} בלונים בנגיעה 🎈</div><div class="items" id="source">${Array.from({length:t.a},(_,i)=>`<button class="item" onclick="pop(${i})" data-i="${i}">🎈</button>`).join('')}</div><p class="hint">נשארו <b id="remaining">${t.a}</b> בלונים</p><button class="btn" onclick="checkPop()">בדיקה ✓</button>`}
else if(t.type==='multiply'){html+=`<div class="prompt">${t.a} קופסאות, ${t.b} סוכריות בכל קופסה</div><div class="targets">${Array.from({length:t.a},()=>`<div class="target"><div style="font-size:25px">${'🍬'.repeat(t.b)}</div></div>`).join('')}</div><p>כמה סוכריות יש בסך הכול?</p>${answerButtons(t.answer)}`}
else if(t.type==='divide'){html+=`<div class="prompt">חלקו ${t.a} מתנות בין ${t.b} ילדים 🎁</div><div class="items">${'🎁'.repeat(Math.min(t.a,30))}</div><div class="targets">${Array.from({length:t.b},()=>'<div class="target">🧒</div>').join('')}</div><p>כמה מתנות יקבל כל ילד?</p>${answerButtons(t.answer)}`}
else if(t.type==='fraction'){html+=`<div class="prompt">צבעו ${t.a} מתוך ${t.b} חלקי הפיצה 🍕</div><div class="items">${Array.from({length:t.b},(_,i)=>`<button class="item" data-i="${i}" onclick="toggleSlice(${i})">${chosen.includes(i)?'🟧':'⬜'}</button>`).join('')}</div><p class="hint">נבחרו <b id="picked">0</b> חלקים</p><button class="btn" onclick="checkSlices()">סיימתי לצבוע ✓</button>`}
else{html+=`<div class="prompt">מגדל החזקות ⚡</div><div style="font-size:42px;margin:25px">${t.a}<sup style="font-size:24px">${t.b}</sup></div><p>${t.a} מוכפל בעצמו ${t.b} פעמים. מה התוצאה?</p>${answerButtons(t.answer)}`}
html+=`<div class="feedback" id="feedback" aria-live="polite"></div></div><div id="next" class="hidden" style="text-align:center;margin-top:20px"><button class="btn" onclick="nextStage()">השלב הבא ←</button></div></div>`;app.innerHTML=html}function answerButtons(ans){return `<div class="targets">${choices(ans).map(x=>`<button class="answer" onclick="check(${x})">${x}</button>`).join('')}</div>`}function backHouse(){openHouse(Math.floor(stage/5))}function check(v){if(completed)return; if(v===task.answer)win();else fail('כמעט! נסו שוב 🌈')}function fail(s){let f=$('#feedback');f.textContent=s;f.className='feedback error'}function win(){if(completed)return;completed=true;if(!won(group,world,stage)){save.wins[id(group,world,stage)]=true;save.coins+=10;persist()}let f=$('#feedback');f.textContent='✨ הצלחתם! +10 מטבעות 🪙';f.className='feedback success';$('#next').classList.remove('hidden');document.querySelectorAll('#gamebox button').forEach(b=>b.disabled=true)}function nextStage(){if(stage%5===4){openWorld(world)}else play(stage+1)}function pick(i){if(completed)return;let el=document.querySelector(`[data-i="${i}"]`);if(!el||el.disabled)return;el.disabled=true;el.style.visibility='hidden';chosen.push(i);$('#basketCount').textContent=`${chosen.length} / ${task.a}`;if(chosen.length===task.a)win()}function dragStart(e,i){e.dataTransfer.setData('text/plain',i)}function dropItem(e){e.preventDefault();pick(Number(e.dataTransfer.getData('text/plain')))}function pop(i){if(completed)return;let el=document.querySelector(`[data-i="${i}"]`);if(el.disabled)return;el.disabled=true;el.style.opacity='.15';chosen.push(i);$('#remaining').textContent=task.a-chosen.length}function checkPop(){if(chosen.length===task.b)win();else fail(`צריך להעלים בדיוק ${task.b} בלונים`)}function toggleSlice(i){if(completed)return;chosen=chosen.includes(i)?chosen.filter(x=>x!==i):[...chosen,i];document.querySelectorAll('#gamebox .item').forEach(el=>el.textContent=chosen.includes(Number(el.dataset.i))?'🟧':'⬜');$('#picked').textContent=chosen.length}function checkSlices(){if(chosen.length===task.a)win();else fail(`צריך לבחור ${task.a} חלקים`)}persist();home();
</script></body></html>
