<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1556dc"><link rel="icon" href="icon.png"><title>גאון החשבון — משחק הרפתקאות</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,Arial,sans-serif;background:radial-gradient(circle at 10% 10%,#4aa5ff,#1557d8 50%,#102e89);color:#fff;min-height:100vh}button{font:inherit;cursor:pointer;border:0}button:focus-visible{outline:4px solid #ffcb31;outline-offset:3px}.shell{max-width:1050px;margin:auto;padding:18px}.top{display:flex;align-items:center;gap:16px;justify-content:center;text-align:right;padding:12px}.logo{width:94px;height:94px;object-fit:cover;border-radius:23px;box-shadow:0 12px 25px #001b5c70}.top h1{font-size:clamp(28px,5vw,47px);margin:0}.top p{margin:3px 0;color:#e2f1ff}.surface{background:#f7faff;color:#19315d;border:3px solid #ffffff;border-radius:30px;box-shadow:0 20px 50px #061c6877;padding:clamp(16px,3vw,30px);min-height:400px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.muted{color:#647493}.eyebrow{color:#5773a4;font-size:14px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(205px,1fr));gap:14px}.tile{background:#fff;border:2px solid #e3eafd;border-radius:22px;padding:18px;text-align:right;color:#19315d;box-shadow:0 6px 0 #d8e4f8;transition:transform .15s,box-shadow .15s;min-height:145px}.tile:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 9px 0 #d8e4f8}.tile.selected{border-color:#ffb900;background:#fff7d7}.tile .emoji{font-size:42px;display:block}.tile strong{display:block;font-size:20px;margin:7px 0}.tile small{font-size:14px;color:#657393}.tile:disabled{opacity:.5;cursor:not-allowed}.worlds{grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.pill{background:#e7f0ff;border-radius:99px;padding:7px 12px;color:#2856a2;font-size:13px;font-weight:800}.primary,.secondary{border-radius:16px;padding:13px 20px;font-weight:900;font-size:17px}.primary{background:#ffca30;color:#483200;box-shadow:0 5px 0 #e3a500}.secondary{background:#e5eeff;color:#214a99}.house-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px}.house{background:linear-gradient(155deg,#eaf2ff,#fff);border:2px solid #d8e5fc;border-radius:24px;padding:15px}.house h3{margin:0 0 10px;font-size:20px}.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}.stage{aspect-ratio:1;border-radius:13px;background:#dbeaff;color:#21417e;font-weight:900;font-size:18px}.stage.done{background:#c4f5d7;color:#176b3d}.stage.next{background:#ffcc3c;color:#553d00}.stage:disabled{opacity:.4;cursor:not-allowed}.progress{height:15px;background:#e2eaf8;border-radius:99px;overflow:hidden;margin:18px 0}.progress div{height:100%;background:linear-gradient(90deg,#36c987,#86e05a);transition:width .25s}.q{text-align:center;font-size:clamp(32px,6vw,58px);font-weight:950;margin:18px 0;direction:ltr}.visual{min-height:42px;text-align:center;font-size:clamp(23px,4vw,34px);line-height:1.8;overflow-wrap:anywhere}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;max-width:620px;margin:22px auto}.choice{background:#e4eeff;color:#17448f;border:3px solid #cdddf8;border-radius:22px;padding:20px 8px;font-size:clamp(23px,4vw,34px);font-weight:900;min-height:86px}.choice:hover:not(:disabled){background:#fff1ba}.choice.correct{background:#9ae6b5;border-color:#2eaa65}.choice.wrong{background:#ffc4c4;border-color:#ec6666}.feedback{min-height:34px;text-align:center;font-size:21px;font-weight:900}.hint{text-align:center;color:#687da2;font-size:15px}.end{text-align:center;padding:25px 0}.end .trophy{font-size:84px}.footer{text-align:center;color:#d8e8ff;font-size:13px;margin:22px 0}.notice{background:#eaf4ff;border-radius:15px;padding:13px;color:#36588d}.stats{display:flex;gap:8px;flex-wrap:wrap}.stats span{background:#e9f0ff;border-radius:99px;padding:8px 13px;font-weight:800}.coins{background:#fff1b7!important;color:#815900}.spaced{margin-top:24px}@media(max-width:540px){.shell{padding:10px}.logo{width:76px;height:76px}.surface{border-radius:23px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.tile{min-height:140px;padding:12px}.tile strong{font-size:17px}.tile .emoji{font-size:32px}.worlds,.house-grid{grid-template-columns:1fr}.choices{gap:8px}.choice{min-height:76px}.top{gap:10px}}
</style></head><body><div class="shell"><header class="top"><img class="logo" src="icon.png" alt="לוגו גאון החשבון"><div><h1>גאון החשבון</h1><p>הרפתקה מתמטית מלאה בכוכבים, בתים והפתעות!</p></div></header><main class="surface" id="app"></main><footer class="footer">4 רמות גיל · 8 עולמות · 240 שלבים · ההתקדמות נשמרת בדפדפן במכשיר הזה</footer></div><script>
const tiers=[{name:'מתנסים',age:'4–6',emoji:'🧸',desc:'מכירים מספרים, סופרים ומשחקים'},{name:'מתחילים',age:'6–8',emoji:'🌈',desc:'מתאמנים בחיבור וחיסור'},{name:'מתקדמים',age:'8–10',emoji:'🚀',desc:'כפל וחילוק בהרפתקה'},{name:'מנוסים',age:'10–19',emoji:'🏆',desc:'שברים, חזקות ואתגרי חשיבה'}];
const worlds=[{tier:0,name:'יער המספרים',emoji:'🌳',op:'count',desc:'ספירה, השוואה וזיהוי מספרים'},{tier:0,name:'גן הצורות',emoji:'🔷',op:'shape',desc:'צורות, דפוסים וסדרות'},{tier:1,name:'ממלכת החיבור',emoji:'🍎',op:'add',desc:'מחברים ומגלים אוצרות'},{tier:1,name:'עמק החיסור',emoji:'🍭',op:'sub',desc:'מחסרים ופותרים חידות'},{tier:2,name:'אי הכפל',emoji:'🏴‍☠️',op:'mul',desc:'קבוצות, כפולות ולוח הכפל'},{tier:2,name:'מגדל החילוק',emoji:'🏰',op:'div',desc:'חלוקה שווה והרפתקאות'},{tier:3,name:'כוכב השברים',emoji:'🍕',op:'frac',desc:'חלקים, שברים והשוואות'},{tier:3,name:'גלקסיית החזקות',emoji:'⚡',op:'pow',desc:'כפל חוזר, חזקות ואתגרים'}];
let screen='home',tier=0,wi=0,stage=0,round=0,correct=0,mistakes=0,q=null,waiting=false;const app=document.getElementById('app');let progress={};try{progress=JSON.parse(localStorage.getItem('gaon-v2')||'{}')}catch{};const get=(w)=>progress[w]||{done:[],unlocked:0,stars:{}};const save=()=>{try{localStorage.setItem('gaon-v2',JSON.stringify(progress))}catch{}};const R=n=>Math.floor(Math.random()*n),pick=a=>a[R(a.length)],shuffle=a=>{for(let i=a.length-1;i>0;i--){let j=R(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));const safe=n=>String(n).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function header(title,back){return `<div class="row"><button class="secondary" onclick="${back}">↩ חזרה</button><span class="pill">${title}</span><span class="pill coins">🪙 ${Object.values(progress).reduce((s,p)=>s+(p.done?.length||0)*10,0)} מטבעות</span></div>`}
function home(){screen='home';render()}function chooseTier(t){tier=t;screen='worlds';render()}function chooseWorld(w){wi=w;screen='map';render()}function play(s){if(s>get(wi).unlocked)return;stage=s;round=0;correct=0;mistakes=0;screen='game';next()}
function render(){if(screen==='home'){app.innerHTML=`<div class="row"><div><div class="eyebrow">ברוכים הבאים!</div><h2>באיזו רמה נשחק היום?</h2></div><span class="pill">⭐ בחרו הרפתקה</span></div><div class="grid spaced">${tiers.map((t,i)=>`<button class="tile" onclick="chooseTier(${i})"><span class="emoji">${t.emoji}</span><strong>${t.name}</strong><span class="pill">גיל ${t.age}</span><p><small>${t.desc}</small></p></button>`).join('')}</div><p class="notice spaced">אפשר לבחור כל רמה לפי היכולת, בלי קשר לגיל. בכל עולם יש 6 בתים ו־30 שלבים. בכל שלב פותרים 5 חידות ומרוויחים כוכבים ומטבעות.</p>`;return}
if(screen==='worlds'){let t=tiers[tier];app.innerHTML=header(`גיל ${t.age}`,'home()')+`<h2>${t.emoji} ${t.name}</h2><p class="muted">${t.desc}</p><div class="grid worlds spaced">${worlds.map((w,i)=>w.tier===tier?`<button class="tile" onclick="chooseWorld(${i})"><span class="emoji">${w.emoji}</span><strong>${w.name}</strong><p>${w.desc}</p><span class="pill">⭐ ${get(i).done.length}/30 שלבים</span></button>`:'').join('')}</div>`;return}
if(screen==='map'){let w=worlds[wi],p=get(wi);app.innerHTML=header(w.name,`chooseTier(${tier})`)+`<h2>${w.emoji} ${w.name}</h2><p class="muted">בחרו בית ושלב. כל חמישה שלבים נפתח בית חדש.</p><div class="house-grid spaced">${Array.from({length:6},(_,h)=>`<div class="house"><h3>${['🏡','🏠','🏯','🏰','🛖','🏆'][h]} בית ${h+1}</h3><div class="stages">${Array.from({length:5},(_,j)=>{let s=h*5+j,done=p.done.includes(s),open=s<=p.unlocked;return `<button class="stage ${done?'done':open?'next':''}" ${open?'':'disabled'} onclick="play(${s})" aria-label="שלב ${s+1}">${done?'★':open?s+1:'🔒'}</button>`}).join('')}</div></div>`).join('')}</div>`;return}
if(screen==='game')renderQuestion()}
function opts(ans,lo=0,hi=9999){let s=new Set([ans]),step=Math.max(3,Math.ceil(Math.abs(ans)*.22));for(let k=0;s.size<4&&k<120;k++){let v=ans+(R(step*2+1)-step);if(v>=lo&&v<=hi)s.add(v)}for(let v=lo;s.size<4&&v<=hi;v++)s.add(v);return shuffle([...s].slice(0,4))}
function question(){let op=worlds[wi].op,s=stage+1,a,b,ans,display,visual='',hint='',options,caption='';let cap=clamp(5+Math.floor(stage/4)*5,5,60);
if(op==='count'){if(stage<10){a=1+R(clamp(3+Math.floor(stage/2),3,10));ans=a;display='כמה פריטים יש?';visual=Array(a).fill(pick(['🍎','⭐','🐟','🎈'])).join(' ');hint='ספרו פריט אחר פריט';options=opts(ans,1,15)}else if(stage<20){a=1+R(12);b=1+R(12);ans=Math.max(a,b);display=`מה המספר הגדול יותר: ${a} או ${b}?`;hint='בחרו את המספר הגדול';options=opts(ans,1,20)}else{a=1+R(30);ans=a+1;display=`מה בא אחרי ${a}?`;hint='סופרים עוד אחד';options=opts(ans,1,40)}}
if(op==='shape'){if(stage<10){a=1+R(9);ans=a+1;display=`השלימו את הסדרה: ${a-1}, ${a}, ?`;visual='🔵 🟡 🔵 🟡';hint='המספר הבא גדול באחד';options=opts(ans,1,15)}else if(stage<20){a=2+R(8);ans=a+2;display=`השלימו: ${a-2}, ${a}, ?`;hint='קופצים בשתיים';options=opts(ans,1,20)}else{a=2+R(7);b=1+R(5);ans=a+b;display=`${a} 🔷 ועוד ${b} 🔷. כמה צורות?`;visual='🔷'.repeat(a)+'  +  '+'🔷'.repeat(b);hint='סופרים את כל הצורות';options=opts(ans,1,20)}}
if(op==='add'){a=R(cap+1);b=R(cap+1);ans=a+b;display=`${a} + ${b} = ?`;hint='אפשר להתחיל מהמספר הגדול ולהמשיך לספור';if(stage<6)visual='🍎'.repeat(Math.min(a,8))+' + '+'🍎'.repeat(Math.min(b,8));options=opts(ans,0,150)}
if(op==='sub'){a=R(cap+1);b=R(a+1);ans=a-b;display=`${a} − ${b} = ?`;hint='חשבו כמה נשאר אחרי שמורידים';if(stage<6)visual='🍬'.repeat(Math.min(a,12));options=opts(ans,0,100)}
if(op==='mul'){a=1+R(clamp(2+Math.floor(stage/3),2,12));b=1+R(clamp(4+Math.floor(stage/3),4,12));ans=a*b;display=`${a} × ${b} = ?`;hint='כפל הוא חיבור של קבוצות שוות';if(stage<7)visual=Array(a).fill('●'.repeat(Math.min(b,9))).join('  |  ');options=opts(ans,0,160)}
if(op==='div'){b=1+R(clamp(3+Math.floor(stage/3),3,12));ans=1+R(clamp(4+Math.floor(stage/3),4,12));a=b*ans;display=`${a} ÷ ${b} = ?`;hint=`כמה פעמים ${b} נכנס ב־${a}?`;if(stage<6)visual=`🎁 חלקו ${a} מתנות בין ${b} חברים`;options=opts(ans,0,20)}
if(op==='frac'){let den=pick(stage<10?[2,3,4]:stage<20?[2,3,4,5,6]:[2,3,4,5,6,8,10]);let num=1+R(den-1);if(stage<10){ans=num;display=`כמה חלקים צבועים מתוך ${den}?`;visual='🟩'.repeat(num)+'⬜'.repeat(den-num);hint='ספרו את החלקים הירוקים';options=opts(ans,1,den)}else{let multiplier=1+R(stage<20?5:10);let total=den*multiplier;ans=num*multiplier;display=`כמה הם ${num}/${den} מתוך ${total}?`;hint=`חלקו את ${total} ל־${den} חלקים, ואז קחו ${num}`;options=opts(ans,0,total)}}
if(op==='pow'){a=2+R(clamp(2+Math.floor(stage/5),2,7));b=stage<10?2:stage<22?2+R(2):2+R(3);ans=a**b;display=`${a}^${b} = ?`;visual=Array(b).fill(a).join(' × ');hint='חזקה היא כפל חוזר של אותו מספר';options=opts(ans,0,Math.max(150,ans+150))}
return {display,visual,hint,ans,options}}
function next(){waiting=false;q=question();renderQuestion()}function renderQuestion(){let w=worlds[wi];app.innerHTML=header(`שלב ${stage+1} מתוך 30`,`chooseWorld(${wi})`)+`<div class="row spaced"><h2>${w.emoji} ${w.name}</h2><div class="stats"><span>שאלה ${round+1}/5</span><span>⭐ ${correct}</span></div></div><div class="progress"><div style="width:${round*20}%"></div></div><div class="q">${safe(q.display)}</div><div class="visual">${q.visual}</div><div class="choices">${q.options.map((x,i)=>`<button class="choice" onclick="check(${x},${i})">${x}</button>`).join('')}</div><div class="feedback" id="feedback" aria-live="polite"></div><p class="hint">💡 ${q.hint}</p>`}
function check(v,i){if(waiting)return;let buttons=[...document.querySelectorAll('.choice')],feedback=document.getElementById('feedback');if(v===q.ans){waiting=true;correct++;buttons[i].classList.add('correct');feedback.textContent=pick(['כל הכבוד! ⭐','תשובה מעולה! 🎉','איזה יופי! 🌟']);buttons.forEach(b=>b.disabled=true);setTimeout(()=>{round++;if(round===5)finish();else next()},650)}else{mistakes++;buttons[i].classList.add('wrong');buttons[i].disabled=true;feedback.textContent='לא נורא, נסו תשובה אחרת!'}}
function finish(){screen='end';let p=get(wi);if(!p.done.includes(stage))p.done.push(stage);p.unlocked=Math.max(p.unlocked,Math.min(29,stage+1));p.stars[stage]=Math.max(p.stars[stage]||0,clamp(3-Math.floor(mistakes/2),1,3));progress[wi]=p;save();app.innerHTML=`<div class="end"><div class="trophy">🏆</div><h2>אלופים! סיימתם שלב ${stage+1}</h2><p style="font-size:28px">${'⭐'.repeat(p.stars[stage])}</p><p>עניתם על 5 שאלות וצברתם 10 מטבעות 🪙</p><div class="row" style="justify-content:center;margin-top:25px"><button class="primary" onclick="${stage<29?`play(${stage+1})`:`chooseWorld(${wi})`}">${stage<29?'לשלב הבא ←':'חזרה למפה'}</button><button class="secondary" onclick="chooseWorld(${wi})">מפת הבתים</button></div></div>`}
render();
</script></body></html>
